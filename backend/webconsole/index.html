<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telomy Console</title>
<meta name="description" content="Wellness-centre and doctor management console for Telomy.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="dot">T</span><span id="orgName">Telomy</span></div>
    <div class="ws-switch">
      <button data-ws="centre" class="on">Centre</button>
      <button data-ws="doctor">Doctor</button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><a id="signout">Sign out</a> · <span id="apiHost" class="small"></span></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="search"><input id="search" placeholder="Search…" hidden></div>
      <div id="pageActions" class="row center"></div>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<!-- login -->
<div id="login" class="card" style="max-width:380px;margin:12vh auto;" hidden>
  <div class="brand" style="padding:0 0 14px"><span class="dot">T</span><span>Telomy Console</span></div>
  <p class="muted small" style="margin-top:0">Sign in to your centre / clinic workspace.</p>
  <label class="field"><span>Server</span><input id="srv" placeholder="https://your-telomy-server"></label>
  <label class="field"><span>Access password</span><input id="pw" type="password" placeholder="••••••••"></label>
  <div id="loginErr" class="small" style="color:var(--danger)"></div>
  <button class="btn primary" style="width:100%;justify-content:center" id="loginBtn">Sign in</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dh"><h3 id="drawerTitle">Edit</h3><button class="btn ghost sm" id="drawerClose">✕</button></div>
  <div class="db" id="drawerBody"></div>
  <div class="df" id="drawerFoot"></div>
</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
